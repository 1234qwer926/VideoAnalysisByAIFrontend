<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pulselogo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMS - Interview Portal</title>
    <!-- Content Security Policy: mitigate XSS by restricting script sources.
         For production, tighten script-src to remove 'unsafe-inline' and google.com -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        img-src 'self' data: blob: https://lh3.googleusercontent.com;
        font-src 'self' https://fonts.gstatic.com;
        connect-src 'self' http://localhost:8000 http://localhost:3000 http://localhost:5173 https://accounts.google.com https://oauth2.googleapis.com;
        frame-src https://accounts.google.com;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
      "
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
